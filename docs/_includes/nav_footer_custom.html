<!-- Overrides the theme's sidebar/footer fallback.

     just-the-docs renders a credit for itself whenever the capture of this
     include comes out EMPTY (see _includes/components/footer.html and
     components/sidebar.html in the theme).  An empty override therefore
     changes nothing; the output has to be non-empty, which this comment is.

     Do NOT "fix" this by overriding footer_custom.html instead.  That is a
     different include, and it is the one that renders site.footer_content,
     the copyright line.  Overriding it removes the copyright and leaves the
     credit, which is backwards.

     The theme is MIT licensed and fetched at build time rather than
     redistributed here, so nothing obliges the rendered pages to carry a
     credit for it.

     Keep this comment free of doubled hyphens: they are legal in HTML but
     the Nu validator reports the document as not mappable to XML 1.0, which
     fails the house check that runs with the Werror flag. -->
